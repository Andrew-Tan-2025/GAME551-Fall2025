header {
  position: relative;
  z-index: 2;
  left: 0px;
  text-align: left;
  max-width: 420px;
  padding: 0.5em;
  background-color: rgba(255, 255, 255, 0);
  margin-bottom: 0.5em;
  border-radius: 2px;
}

details summary {
  font-size: 1.0em;
  font-weight: bold;
}

details[open] summary {
  font-size: 1.4em;
  font-weight: bold;
}

header h1 {
  margin-top: 0px;
}

canvas {
  position: absolute;
  z-index: 0;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  margin: 0;
  touch-action: none;
}

.back {
  float: right;
  text-decoration: none;
}

.back:hover {
  text-decoration: underline;
}

.back::before {
  display: inline-block;
  content: attr(data-index) '<';
  font-weight: bold;
  white-space: nowrap;
  margin-right: 0.2em;
  margin-left: 0.2em;
}

      // Make a new scene
      let scene = new THREE.Scene();
      const loader = new GLTFLoader();

      // Load a glTF resource
      loader.load('MurdockApartment/MurodckApart.gltf', (gltf) => {
            scene.add(gltf.scene);
            // move & scale
            gltf.scene.position.set(0, 0, 2.2);
            //gltf.scene.scale.set(5, 5, 5);
        });
      // Set background color of the scene to gray
      scene.background = new THREE.Color(0x505050);

      // Make a camera. note that far is set to 100, which is better for realworld sized environments
      let camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);
      scene.add(camera);

        // Add some lights
      var light = new THREE.DirectionalLight(0xffffff,0.5);
      light.position.set(1, 1, 1).normalize();
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff,0.5))
      
      // Make a renderer that fills the screen
      let renderer = new THREE.WebGLRenderer({antialias: true});
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      // Turn on VR support
      renderer.xr.enabled = true;
      // Set animation loop
      renderer.setAnimationLoop(render);
      // Add canvas to the page
      document.body.appendChild(renderer.domElement);
      // Add a button to enter/exit vr to the page
      document.body.appendChild(VRButton.createButton(renderer));

      window.addEventListener('resize', onWindowResize, false);

      function onWindowResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function render(time) {
          // Draw everything
          renderer.render(scene, camera);
